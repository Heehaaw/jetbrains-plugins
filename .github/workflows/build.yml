name: Build, test, and package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v5
        with:
          # Only main refreshes the cache shared with pull requests.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Build, test, and verify plugins
        run: ./gradlew --no-daemon --build-cache build
      - name: Verify artifact promotion and JetBrains repository
        run: >-
          ./gradlew --no-daemon --build-cache verifyRelease
          -PreleaseTag=v0.0.0
          -PinputDirectory=codex-terminal-context/build/distributions
          -PoutputDirectory=artifacts/verification
      - name: Upload detailed plugin verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plugin-verification-reports
          path: codex-terminal-context/build/reports/pluginVerifier/
          retention-days: 90
          if-no-files-found: ignore
      - name: Upload installable plugin ZIP
        uses: actions/upload-artifact@v7
        with:
          path: codex-terminal-context/build/distributions/codex-terminal-context-0.0.0-dev.zip
          archive: false
          retention-days: 90
          if-no-files-found: error
      - name: Link to manual release preparation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          {
            echo '## Release preparation'
            echo
            echo "[Prepare a draft release](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/workflows/release.yml)"
            echo
            echo 'Choose **Run workflow**, select the branch, then choose patch, minor, major, or custom.'
            echo
            echo "Tested commit: [${GITHUB_SHA}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})"
          } >> "$GITHUB_STEP_SUMMARY"
